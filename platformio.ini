; platformio.ini — ESP32 ABS firmware
;
; Core 0 runs the 200 Hz control task and the TWAI driver. Core 1 is left
; deliberately free so logging can never delay a control cycle.

[platformio]
default_envs = esp32dev
src_dir = src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -O2
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=1

build_unflags = -Os

; Unit tests for the parts that are pure logic: slip estimation, the
; state machine, and the byte-exact CAN packing. No hardware required.
[env:native]
platform = native
build_flags = -std=c++17 -O1 -Wall -Wextra -DABS_NATIVE_TEST
test_framework = unity
